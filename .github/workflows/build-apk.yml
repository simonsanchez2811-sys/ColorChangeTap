
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Unzip source
        run: unzip ColorChangeTap-Android-Source.zip -d source

      - name: Build APK
        run: |
          cd source/ColorChangeTap
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ColorChangeTap-debug-apk
          path: source/ColorChangeTap/app/build/outputs/apk/debug/app-debug.apk

